<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - CashManager</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CashManager">
    <link rel="stylesheet" href="../assets/css/style.css?v=20261127_m4">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f4f4fe;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Lớp nền HD 2K siêu sắc nét, hardware-accelerated không bị mờ do trình duyệt */
        .auth-bg-fixed {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: url('../assets/images/cashmanager-auth-bg.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 0;
            pointer-events: none;
            image-rendering: -webkit-optimize-contrast;
            transform: translate3d(0, 0, 0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .brand-corner {
            position: fixed;
            top: 2rem;
            left: 2.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            text-decoration: none;
            z-index: 20;
        }
        .brand-icon-box {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 55%, #4338ca 100%);
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.28), inset 0 1px 1px rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .brand-icon-box svg {
            width: 21px;
            height: 21px;
        }
        .brand-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .auth-center-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 3.5rem 1.25rem 1rem;
            position: relative;
            z-index: 10;
        }

        .auth-box {
            width: 100%;
            max-width: 360px;
            position: relative;
        }

        .auth-title {
            text-align: center;
            font-size: 1.75rem;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 0.45rem;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .auth-subtitle {
            text-align: center;
            font-size: 0.875rem;
            font-weight: 500;
            color: #64748b;
            margin: 0 0 1.45rem;
        }

        .google-top-wrap {
            margin-bottom: 1.05rem;
        }
        .google-btn-container {
            display: flex;
            justify-content: center;
            width: 100%;
            min-height: 44px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
            padding: 2px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 0.75rem;
        }
        .field-icon-left {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.18s;
        }
        .auth-input {
            width: 100%;
            padding: 0.82rem 1rem 0.82rem 2.65rem;
            font-size: 0.88rem;
            font-family: inherit;
            font-weight: 500;
            color: #0f172a;
            background: rgba(248, 250, 252, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }
        .auth-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }
        .auth-input:focus {
            background: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 3.5px rgba(99, 102, 241, 0.14);
        }
        .input-group-custom:focus-within .field-icon-left {
            color: #4f46e5;
        }

        .password-toggle-btn {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            font-size: 0.95rem;
        }
        .password-toggle-btn:hover { color: #475569; }

        .btn-primary-purple {
            width: 100%;
            margin-top: 0.35rem;
            position: relative;
            padding: 0.88rem 1.25rem;
            font-size: 0.94rem;
            font-weight: 700;
            font-family: inherit;
            color: #ffffff;
            background: linear-gradient(90deg, #6366f1 0%, #5b3df5 50%, #4f46e5 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary-purple:hover {
            background: linear-gradient(90deg, #4f46e5 0%, #4338ca 100%);
            transform: translateY(-1px);
            box-shadow: 0 14px 26px rgba(79, 70, 229, 0.42), inset 0 1px 1px rgba(255, 255, 255, 0.35);
        }
        .btn-primary-purple .btn-arrow {
            position: absolute;
            right: 18px;
            font-size: 0.95rem;
            transition: transform 0.2s ease;
        }
        .btn-primary-purple:hover .btn-arrow {
            transform: translateX(3px);
        }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            margin: 1.25rem 0 1.05rem;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        .or-divider::before,
        .or-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .signup-prompt {
            text-align: center;
            font-size: 0.86rem;
            color: #334155;
            font-weight: 500;
        }
        .signup-prompt a {
            color: #4f46e5;
            font-weight: 700;
            text-decoration: none;
            margin-left: 3px;
        }
        .signup-prompt a:hover {
            text-decoration: underline;
        }

        .security-footer {
            padding: 1rem 1rem 1.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #64748b;
            z-index: 10;
        }
        .security-footer i {
            color: #6366f1;
            font-size: 0.92rem;
        }

        @media (max-width: 860px) {
            body {
                background-image: radial-gradient(circle at 50% 0%, #eef2ff 0%, #f8fafc 75%);
            }
            .brand-corner {
                position: static;
                margin-top: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Lớp nền 3D siêu sắc nét 2K -->
    <div class="auth-bg-fixed" aria-hidden="true"></div>

    <!-- Logo CashManager góc trái trên -->
    <a href="../index.html" class="brand-corner">
        <div class="brand-icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4" />
                <path d="M4 6v12c0 1.1.9 2 2 2h14v-4" />
                <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z" />
            </svg>
        </div>
        <span class="brand-name">CashManager</span>
    </a>

    <!-- Khu vực Form Đăng Ký Trung Tâm -->
    <main class="auth-center-stage">
        <div class="auth-box">
            <h1 class="auth-title">Tạo tài khoản mới! <span>👋</span></h1>
            <p class="auth-subtitle">Quản lý tài chính thông minh – Làm chủ tương lai.</p>

            <form id="registerForm">
                <div class="input-group-custom">
                    <i class="fa-regular fa-id-card field-icon-left"></i>
                    <input type="text" id="full_name" class="auth-input" placeholder="Họ và tên (VD: Nguyễn Văn A)" required>
                </div>
                <div class="input-group-custom">
                    <i class="fa-regular fa-user field-icon-left"></i>
                    <input type="text" id="username" class="auth-input" placeholder="Tên đăng nhập" autocomplete="username" required>
                </div>
                <div class="input-group-custom">
                    <i class="fa-regular fa-envelope field-icon-left"></i>
                    <input type="email" id="email" class="auth-input" placeholder="Địa chỉ Email" autocomplete="email" required>
                </div>
                <div class="input-group-custom">
                    <i class="fa-solid fa-lock field-icon-left"></i>
                    <input type="password" id="password" class="auth-input" placeholder="Mật khẩu (tối thiểu 6 ký tự)" style="padding-right: 2.65rem;" autocomplete="new-password" required minlength="6">
                    <button type="button" id="btnTogglePass" class="password-toggle-btn" aria-label="Hiện/ẩn mật khẩu">
                        <i class="fa-regular fa-eye-slash"></i>
                    </button>
                </div>

                <button type="submit" class="btn-primary-purple">
                    <span>Đăng ký tài khoản</span>
                    <i class="fa-solid fa-arrow-right btn-arrow"></i>
                </button>
            </form>

            <div class="or-divider">HOẶC</div>

            <!-- Nút Tiếp tục với Google -->
            <div id="googleLoginWrap" class="google-top-wrap" style="margin-bottom: 1.25rem;">
                <div id="googleBtn" class="google-btn-container"></div>
            </div>

            <div class="signup-prompt">
                Đã có tài khoản? <a href="login.html">Đăng nhập ngay.</a>
            </div>
        </div>
    </main>

    <!-- Chân trang Bảo mật -->
    <footer class="security-footer">
        <i class="fa-solid fa-shield-halved"></i>
        <span>An toàn • Bảo mật • Đáng tin cậy.</span>
    </footer>

    <script src="../assets/js/auth.js"></script>
    <script>
        const passInput = document.getElementById('password');
        const btnTogglePass = document.getElementById('btnTogglePass');
        btnTogglePass.addEventListener('click', () => {
            const isHidden = passInput.type === 'password';
            passInput.type = isHidden ? 'text' : 'password';
            btnTogglePass.innerHTML = isHidden
                ? '<i class="fa-regular fa-eye"></i>'
                : '<i class="fa-regular fa-eye-slash"></i>';
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                full_name: document.getElementById('full_name').value.trim(),
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const res = await apiFetch('/auth/register.php', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (res && res.success) {
                    showToast('Thành công', 'Đăng ký thành công! Vui lòng đăng nhập.', 'success');
                    setTimeout(() => window.location.href = 'login.html', 1200);
                } else {
                    showToast('Lỗi', res ? (res.message || res.error) : 'Đăng ký thất bại', 'error');
                }
            } catch (error) {
                console.error('Lỗi đăng ký:', error);
            }
        });
    </script>
    <script src="../assets/js/google-login.js"></script>
    <script src="../assets/js/pwa.js"></script>
</body>
</html>
