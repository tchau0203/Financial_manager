<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Quản Lý Chi Tiêu</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f1f5f9; }
        .auth-card { width: 100%; max-width: 440px; background: #fff; padding: 2.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow); }
        .auth-header { text-align: center; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>Đăng Ký Tài Khoản</h2>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Tạo tài khoản quản lý tài chính</p>
        </div>
        <form id="registerForm">
            <div class="form-group">
                <label class="form-label">Họ và tên</label>
                <input type="text" id="full_name" class="form-control" placeholder="Nguyễn Văn A" required>
            </div>
            <div class="form-group">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" id="username" class="form-control" placeholder="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="example@email.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label class="form-label">Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                <i class="fa-solid fa-user-plus"></i> Đăng ký
            </button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
            Đã có tài khoản? <a href="login.html" style="color: var(--primary); font-weight: 600;">Đăng nhập</a>
        </div>
    </div>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                full_name: document.getElementById('full_name').value.trim(),
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const res = await apiFetch('/auth/register.php', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (res && res.success) {
                    showToast('Thành công', 'Đăng ký thành công! Vui lòng đăng nhập.', 'success');
                    setTimeout(() => window.location.href = 'login.html', 1200);
                } else {
                    showToast('Lỗi', res ? (res.message || res.error) : 'Đăng ký thất bại', 'error');
                }
            } catch (error) {
                console.error('Lỗi đăng ký:', error);
            }
        });
    </script>
</body>
</html>
