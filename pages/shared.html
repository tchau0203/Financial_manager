<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quỹ chung - Quản Lý Chi Tiêu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--primary:#4f46e5;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;min-height:100vh;background:#f8fafc;color:#0f172a;font:14px/1.5 'Inter','Segoe UI',system-ui,sans-serif}
.sidebar{width:235px;flex-shrink:0;background:#0f172a;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:20px 22px;border-bottom:1px solid #1e293b;color:#fff;font-size:19px;font-weight:700}
.logo i{color:#6366f1}
.nav{padding-top:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:14px 22px;border-left:3px solid transparent;color:#cbd5e1;font-weight:500;text-decoration:none}
.nav a i{width:18px;text-align:center}
.nav a:hover,.nav a.active{background:#1e293b;color:#fff}
.nav a.active{border-left-color:var(--primary);font-weight:600}
.main{flex:1;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:#fff;border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px}
.right{display:flex;align-items:center;gap:14px;font-weight:500}
.content{display:grid;gap:22px;padding:28px}
.card{background:#fff;border-radius:12px;padding:22px 24px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.card h3{font-size:16px;margin-bottom:14px}
.grid{display:grid;gap:22px}
.g3{grid-template-columns:repeat(3,1fr)}
.stat small{color:var(--muted);text-transform:uppercase;font-size:12px}
.stat b{display:block;margin-top:10px;font-size:26px}
.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--primary)}
.muted{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:0;border-radius:8px;background:var(--primary);color:#fff;font:600 13px 'Inter','Segoe UI',sans-serif;cursor:pointer}
.btn.out{background:#fee2e2;color:var(--red)}
.btn.ghost{background:#eef2ff;color:var(--primary)}
.tools{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.tools .field{margin:0;min-width:200px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:13px}
input,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit}
input:focus,select:focus{outline:2px solid #c7d2fe;border-color:var(--primary)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.act{justify-content:flex-end;margin-top:14px}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.tag.ok{background:#d1fae5;color:#047857}
table{width:100%;border-collapse:collapse}
th{padding:12px 14px;background:#f1f5f9;color:#475569;font-size:13px;text-align:left}
td{padding:12px 14px;border-bottom:1px solid var(--line)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.hide{display:none!important}
.modal{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;background:rgba(15,23,42,.5)}
.modal.show{display:flex}
.box{width:min(440px,92vw);padding:24px;border-radius:14px;background:#fff}
.box h3{margin-bottom:16px}
.box .act{margin-top:6px}
.toast{display:none;position:fixed;right:22px;bottom:22px;z-index:60;padding:12px 18px;border-radius:10px;background:#0f172a;color:#fff}
.toast.show{display:block}.toast.err{background:var(--red)}
/* Chuyển đổi Ví cá nhân / Quỹ chung */
.seg{display:inline-flex;padding:4px;border-radius:10px;background:#f1f5f9}
.seg button{padding:8px 16px;border:0;border-radius:8px;background:none;color:var(--muted);font:600 13px 'Inter','Segoe UI',sans-serif;cursor:pointer}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(15,23,42,.12)}
/* Avatar */
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;overflow:hidden;border-radius:50%;color:#fff;font-size:12px;font-weight:700}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.who{display:flex;align-items:center;gap:10px;font-weight:500}
.members{display:flex;flex-wrap:wrap;gap:18px}
.mem{display:flex;align-items:center;gap:8px}
@media(max-width:900px){.sidebar{display:none}.g3{grid-template-columns:1fr}.content{padding:16px}.topbar{padding:14px 16px}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo"><i class="fa-solid fa-wallet"></i> CashManager</div>
  <nav class="nav">
    <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Bảng điều khiển</a>
    <a href="income.html"><i class="fa-solid fa-arrow-down"></i> Thu nhập</a>
    <a href="expense.html"><i class="fa-solid fa-arrow-up"></i> Chi tiêu</a>
    <a href="budget.html"><i class="fa-solid fa-piggy-bank"></i> Ngân sách</a>
    <a href="report.html"><i class="fa-solid fa-chart-column"></i> Báo cáo</a>
    <a href="shared.html" class="active"><i class="fa-solid fa-users"></i> Quỹ chung</a>
    <a href="account.html"><i class="fa-solid fa-gear"></i> Tài khoản</a>
  </nav>
</aside>
<div class="main">
  <header class="topbar">
    <h1>Quỹ chi tiêu chung</h1>
    <div class="right"><span id="userName"></span><button class="btn out" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button></div>
  </header>
  <div class="content">
    <div class="card">
      <div class="tools">
        <div class="seg" id="seg">
          <button class="on" data-mode="personal">Ví cá nhân</button>
          <button data-mode="shared">Không gian quỹ chung</button>
        </div>
        <div class="field hide" id="spaceBox"><label for="space">Chọn quỹ</label><select id="space"></select></div>
        <button class="btn ghost hide" id="newSpace"><i class="fa-solid fa-plus"></i> Tạo quỹ mới</button>
        <button class="btn ghost hide" id="inviteBtn"><i class="fa-solid fa-user-plus"></i> Mời thành viên</button>
        <button class="btn hide" id="addTx"><i class="fa-solid fa-plus"></i> Thêm giao dịch</button>
      </div>
    </div>

    <div class="grid g3">
      <div class="card stat"><small>Tổng thu</small><b class="green" id="sIn">0 đ</b></div>
      <div class="card stat"><small>Tổng chi</small><b class="red" id="sOut">0 đ</b></div>
      <div class="card stat"><small>Số dư</small><b class="blue" id="sNet">0 đ</b></div>
    </div>

    <div class="card hide" id="membersCard">
      <h3>Thành viên trong quỹ</h3>
      <div class="members" id="members"></div>
    </div>

    <div class="card">
      <h3 id="tblTitle">Giao dịch gần đây</h3>
      <table>
        <thead><tr><th>Người chi</th><th>Ngày</th><th>Danh mục</th><th>Ghi chú</th><th style="text-align:right">Số tiền</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Tạo quỹ -->
<div class="modal" id="spaceModal"><div class="box">
  <h3>Tạo quỹ chung</h3>
  <form id="spaceForm">
    <div class="field"><label for="spaceName">Tên quỹ</label><input id="spaceName" maxlength="100" placeholder="Ví dụ: Quỹ gia đình, Chi tiêu phòng 402" required></div>
    <div class="row act"><button type="button" class="btn ghost" data-close>Hủy</button><button type="submit" class="btn">Tạo quỹ</button></div>
  </form>
</div></div>

<!-- Mời thành viên -->
<div class="modal" id="inviteModal"><div class="box">
  <h3>Mời thành viên vào quỹ</h3>
  <form id="inviteForm">
    <div class="field"><label for="inviteEmail">Email người được mời</label><input type="email" id="inviteEmail" placeholder="ten@email.com" required></div>
    <div class="row act"><button type="button" class="btn ghost" data-close>Hủy</button><button type="submit" class="btn">Gửi lời mời</button></div>
  </form>
</div></div>

<!-- Thêm giao dịch vào quỹ -->
<div class="modal" id="txModal"><div class="box">
  <h3>Thêm giao dịch vào quỹ</h3>
  <form id="txForm">
    <div class="field"><label for="txType">Loại</label>
      <select id="txType"><option value="expense">Chi tiêu</option><option value="income">Thu nhập</option></select></div>
    <div class="field"><label for="txCat">Danh mục</label><select id="txCat"></select></div>
    <div class="field"><label for="txAmount">Số tiền (đ)</label><input type="number" id="txAmount" min="1000" step="1000" required></div>
    <div class="field"><label for="txDate">Ngày</label><input type="date" id="txDate" required></div>
    <div class="field"><label for="txNote">Ghi chú</label><input id="txNote" maxlength="200"></div>
    <div class="row act"><button type="button" class="btn ghost" data-close>Hủy</button><button type="submit" class="btn">Lưu giao dịch</button></div>
  </form>
</div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let mode = 'personal', me = {}, spaces = [], cats = [], members = [], txs = [], timer;

  // ===== Hàm dùng chung =====
  const api = async (url, opts = {}) => {
    const o = { credentials: 'same-origin', headers: {}, ...opts };
    if (o.body && !(o.body instanceof FormData) && typeof o.body !== 'string') { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(o.body); }
    const r = await fetch(url, o);
    if (r.status === 401) { location.href = 'login.html'; throw new Error('Chưa đăng nhập'); }
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (!r.ok || j.success === false || j.status === 'error') throw new Error(j.message || j.error || 'Có lỗi xảy ra, vui lòng thử lại');
    return j.data !== undefined ? j.data : j;
  };
  const post = (url, body) => api(url, { method: 'POST', body });
  const list = d => Array.isArray(d) ? d : (d && Object.values(d).find(Array.isArray)) || [];
  const money = n => new Intl.NumberFormat('vi-VN').format(Math.round(+n || 0)) + ' đ';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const toast = (msg, err) => {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(timer);
    timer = setTimeout(() => { t.className = 'toast'; }, 2800);
  };
  async function initUser() {
    let u = {};
    try {
      const d = await api('../api/auth/me.php');
      u = d.user || d;
      $('userName').textContent = u.full_name || u.name || u.username || '';
    } catch (e) {}
    $('logoutBtn').onclick = async () => {
      try { await api('../api/auth/logout.php', { method: 'POST' }); } catch (e) {}
      location.href = 'login.html';
    };
    return u;
  }

  // ===== Avatar chữ cái đầu (có ảnh thì hiện ảnh) =====
  const PALETTE = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#06b6d4', '#8b5cf6', '#ec4899', '#0ea5e9'];
  const ini = n => { const w = String(n || '?').trim().split(/\s+/); return ((w[0][0] || '?') + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase(); };
  const avatar = (name, url) => {
    let h = 0;
    for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const img = url ? `<img src="${esc(url)}" alt="" onerror="this.remove()">` : '';
    return `<span class="av" style="background:${PALETTE[h % PALETTE.length]}">${esc(ini(name))}${img}</span>`;
  };
  const fmtDate = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || ''); };
  const who = t => t.user_name ?? t.full_name ?? t.paid_by ?? t.created_by_name ?? (me.full_name || me.name || 'Tôi');
  const sid = s => s.id ?? s.space_id;
  const cur = () => spaces.find(s => sid(s) == $('space').value);

  // ===== Hiển thị =====
  function updateActions() {
    const shared = mode === 'shared', s = cur();
    $('spaceBox').classList.toggle('hide', !shared || !spaces.length);
    $('newSpace').classList.toggle('hide', !shared);
    $('inviteBtn').classList.toggle('hide', !shared || !s || !!(s.role && s.role !== 'owner'));
    $('addTx').classList.toggle('hide', !shared || !s);
    $('membersCard').classList.toggle('hide', !shared || !members.length);
    $('tblTitle').textContent = shared ? (s ? `Chi tiêu của "${s.name}"` : 'Chi tiêu của quỹ') : 'Giao dịch cá nhân gần đây';
  }

  function render() {
    const sum = type => txs.filter(t => t.type === type).reduce((a, t) => a + (+t.amount || 0), 0);
    const inc = sum('income'), exp = sum('expense');
    $('sIn').textContent = money(inc);
    $('sOut').textContent = money(exp);
    $('sNet').textContent = money(inc - exp);

    const empty = mode === 'shared' && !spaces.length
      ? 'Bạn chưa tham gia quỹ chung nào. Chọn "Tạo quỹ mới" để bắt đầu.'
      : 'Chưa có giao dịch nào.';
    $('tbody').innerHTML = txs.length ? txs.map(t => {
      const inc = t.type === 'income';
      return `<tr>
        <td><div class="who">${avatar(who(t), t.avatar)}<span>${esc(who(t))}</span></div></td>
        <td>${esc(fmtDate(t.date ?? t.transaction_date))}</td>
        <td>${esc(t.category_name ?? t.category ?? '')}</td>
        <td>${esc(t.note ?? t.description ?? '')}</td>
        <td style="text-align:right"><b class="${inc ? 'green' : 'red'}">${inc ? '+' : '-'}${money(t.amount)}</b></td>
      </tr>`;
    }).join('') : `<tr><td colspan="5" class="empty">${empty}</td></tr>`;

    $('members').innerHTML = members.map(m => {
      const n = m.full_name ?? m.name ?? m.user_name ?? '';
      return `<div class="mem">${avatar(n, m.avatar)}<span>${esc(n)}</span>${m.role === 'owner' ? '<span class="tag ok">Chủ quỹ</span>' : ''}</div>`;
    }).join('');
    updateActions();
  }

  // ===== Tải dữ liệu =====
  async function loadTx() {
    try {
      if (mode === 'personal') {
        const [i, e] = await Promise.all(['income', 'expense'].map(type =>
          api(`../api/transaction/list.php?type=${type}`).then(d => list(d).map(x => ({ type, ...x })))));
        txs = [...i, ...e];
        members = [];
      } else if (cur()) {
        const d = await api(`../api/shared/transactions.php?space_id=${$('space').value}`);
        txs = d.transactions || d.items || list(d);
        members = d.members || cur().members || [];
      } else { txs = []; members = []; }
      const day = t => String(t.date ?? t.transaction_date ?? '');
      txs.sort((a, b) => day(b).localeCompare(day(a)));
      if (mode === 'personal') txs = txs.slice(0, 50);
    } catch (e) { txs = []; members = []; toast(e.message, true); }
    render();
  }

  async function loadSpaces(selectId) {
    try {
      spaces = list(await api('../api/shared/list.php'));
      $('space').innerHTML = spaces.map(s => `<option value="${sid(s)}">${esc(s.name)}</option>`).join('');
      if (selectId) $('space').value = selectId;
    } catch (e) { spaces = []; toast(e.message, true); }
    loadTx();
  }

  function setMode(m) {
    mode = m;
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
    m === 'shared' ? loadSpaces() : loadTx();
  }

  // ===== Modal =====
  const open = id => $(id).classList.add('show');
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.modal').classList.remove('show'));
  document.querySelectorAll('.modal').forEach(m => m.onclick = e => { if (e.target === m) m.classList.remove('show'); });

  // Tạo quỹ
  $('newSpace').onclick = () => { $('spaceForm').reset(); open('spaceModal'); $('spaceName').focus(); };
  $('spaceForm').onsubmit = async e => {
    e.preventDefault();
    try {
      const d = await post('../api/shared/create.php', { name: $('spaceName').value.trim() });
      $('spaceModal').classList.remove('show');
      toast('Đã tạo quỹ chung');
      loadSpaces(d.id ?? d.space_id);
    } catch (err) { toast(err.message, true); }
  };

  // Mời thành viên
  $('inviteBtn').onclick = () => { $('inviteForm').reset(); open('inviteModal'); $('inviteEmail').focus(); };
  $('inviteForm').onsubmit = async e => {
    e.preventDefault();
    try {
      const d = await post('../api/shared/invite.php', { space_id: +$('space').value, email: $('inviteEmail').value.trim() });
      $('inviteModal').classList.remove('show');
      const code = d.invite_code ?? d.code;
      toast(code ? `Đã mời thành viên. Mã mời: ${code}` : 'Đã gửi lời mời');
      loadTx();
    } catch (err) { toast(err.message, true); }
  };

  // Thêm giao dịch vào quỹ
  const fillCats = () => {
    $('txCat').innerHTML = cats.filter(c => c.type === $('txType').value)
      .map(c => `<option value="${c.id ?? c.category_id}">${esc(c.name ?? c.category_name)}</option>`).join('');
  };
  $('txType').onchange = fillCats;
  $('addTx').onclick = () => {
    $('txForm').reset();
    $('txDate').value = new Date().toLocaleDateString('sv-SE');
    fillCats(); open('txModal');
  };
  $('txForm').onsubmit = async e => {
    e.preventDefault();
    const body = {
      space_id: +$('space').value, type: $('txType').value, category_id: +$('txCat').value,
      amount: +$('txAmount').value, date: $('txDate').value, transaction_date: $('txDate').value, note: $('txNote').value.trim()
    };
    if (!body.category_id || body.amount <= 0) return toast('Chọn danh mục và nhập số tiền lớn hơn 0', true);
    try {
      await post('../api/shared/transactions.php', body);
      $('txModal').classList.remove('show');
      toast('Đã thêm giao dịch vào quỹ');
      loadTx();
    } catch (err) { toast(err.message, true); }
  };

  // ===== Sự kiện chung =====
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  $('space').onchange = loadTx;

  (async () => {
    me = await initUser();
    try { cats = list(await api('../api/category/list.php')); } catch (e) {}
    setMode('personal');
  })();
})();
</script>
</body>
</html>
