<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ngân sách - Quản Lý Chi Tiêu</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CashManager">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--primary:#4f46e5;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;min-height:100vh;background:#f8fafc;color:#0f172a;font:14px/1.5 'Inter','Segoe UI',system-ui,sans-serif}
.sidebar{width:235px;flex-shrink:0;background:#0f172a;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:20px 22px;border-bottom:1px solid #1e293b;color:#fff;font-size:19px;font-weight:700}
.logo i{color:#6366f1}
.nav{padding-top:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:14px 22px;border-left:3px solid transparent;color:#cbd5e1;font-weight:500;text-decoration:none}
.nav a i{width:18px;text-align:center}
.nav a:hover,.nav a.active{background:#1e293b;color:#fff}
.nav a.active{border-left-color:var(--primary);font-weight:600}
.main{flex:1;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:#fff;border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px}
.right{display:flex;align-items:center;gap:14px;font-weight:500}
.content{display:grid;gap:22px;padding:28px}
.card{background:#fff;border-radius:12px;padding:22px 24px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.card h3{font-size:16px;margin-bottom:14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h3{margin:0}
.grid{display:grid;gap:22px}
.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.muted{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:0;border-radius:8px;background:var(--primary);color:#fff;font:600 13px 'Inter','Segoe UI',sans-serif;cursor:pointer}
.btn.out{background:#fee2e2;color:var(--red)}
.btn.ghost{background:#eef2ff;color:var(--primary)}
.tools{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.tools .field{margin:0;min-width:150px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:13px}
input,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit}
input:focus,select:focus{outline:2px solid #c7d2fe;border-color:var(--primary)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row.muted{margin-top:8px}
.act{justify-content:flex-end;margin-top:14px}
.bar{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;width:0;height:100%;border-radius:99px;transition:width .4s}
.bar i.ok{background:var(--green)}.bar i.warn{background:var(--amber)}.bar i.over{background:var(--red)}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.tag.ok{background:#d1fae5;color:#047857}.tag.warn{background:#fef3c7;color:#b45309}.tag.over{background:#fee2e2;color:#b91c1c}
.empty{padding:24px;text-align:center;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;background:rgba(15,23,42,.5)}
.modal.show{display:flex}
.box{width:min(440px,92vw);padding:24px;border-radius:14px;background:#fff}
.box h3{margin-bottom:16px}
.box .act{margin-top:6px}
.toast{display:none;position:fixed;right:22px;bottom:22px;z-index:60;padding:12px 18px;border-radius:10px;background:#0f172a;color:#fff}
.toast.show{display:block}.toast.err{background:var(--red)}
@media(max-width:900px){.sidebar{display:none}.content{padding:16px}.topbar{padding:14px 16px}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo"><i class="fa-solid fa-wallet"></i> CashManager</div>
  <nav class="nav">
    <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Bảng điều khiển</a>
    <a href="income.html"><i class="fa-solid fa-arrow-down"></i> Thu nhập</a>
    <a href="expense.html"><i class="fa-solid fa-arrow-up"></i> Chi tiêu</a>
    <a href="budget.html" class="active"><i class="fa-solid fa-piggy-bank"></i> Ngân sách</a>
    <a href="report.html"><i class="fa-solid fa-chart-column"></i> Báo cáo</a>
    <a href="map.html"><i class="fa-solid fa-map-location-dot"></i> Bản đồ thu chi</a>
    <a href="shared.html"><i class="fa-solid fa-users"></i> Quỹ chung</a>
  </nav>
</aside>
<div class="main">
  <header class="topbar">
    <h1>Kế hoạch ngân sách</h1>
    <div class="header-user-nav" id="headerUserNav">
        <button type="button" class="btn-quick-tx" id="btnHeaderAddTx" title="Thêm giao dịch mới">
            <i class="fa-solid fa-plus"></i> Giao dịch
        </button>
        <div class="user-dropdown-wrapper" id="userDropdownWrapper">
            <button type="button" class="user-profile-btn" id="userProfileBtn" aria-expanded="false" title="Tài khoản">
                <span class="user-avatar-circle" id="headerAvatar">T</span>
                <span class="user-profile-name" id="headerUserName">Thái Châu</span>
                <i class="fa-solid fa-caret-down user-profile-caret"></i>
            </button>
            <div class="user-dropdown-menu" id="userDropdownMenu">
                <a href="account.html" class="user-dropdown-item" id="menuItemSettings">
                    <i class="fa-solid fa-sliders"></i>
                    <span>Cài đặt</span>
                </a>
                <a href="help.html" target="_blank" class="user-dropdown-item" id="menuItemHelp">
                    <i class="fa-regular fa-circle-question"></i>
                    <span>Trợ giúp</span>
                </a>
                <a href="javascript:void(0)" class="user-dropdown-item item-logout" id="menuItemLogout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Đăng xuất</span>
                </a>
            </div>
        </div>
    </div>
  </header>
  <div class="content">
    <div class="card">
      <div class="tools">
        <div class="field"><label for="month">Tháng</label><select id="month"></select></div>
        <div class="field"><label for="year">Năm</label><select id="year"></select></div>
        <button class="btn" id="addBtn"><i class="fa-solid fa-plus"></i> Đặt ngân sách</button>
      </div>
    </div>
    <div class="card">
      <div class="head"><h3>Tiến độ ngân sách cả tháng</h3><span class="muted" id="sumText"></span></div>
      <div class="bar"><i id="sumBar"></i></div>
    </div>
    <div class="grid g3" id="grid"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="mTitle">Đặt ngân sách</h3>
    <form id="form">
      <div class="field"><label for="cat">Danh mục chi tiêu</label><select id="cat"></select></div>
      <div class="field"><label for="amount">Hạn mức (đ)</label><input type="number" id="amount" min="1000" step="1000" required></div>
      <div class="field"><label for="thr">Ngưỡng cảnh báo (%)</label><input type="number" id="thr" min="1" max="100" value="80"></div>
      <div class="row act"><button type="button" class="btn ghost" id="cancel">Hủy</button><button type="submit" class="btn">Lưu ngân sách</button></div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../assets/js/pwa.js"></script>
<script src="../assets/js/header_nav.js?v=20261127"></script>
<script src="../assets/js/budget.js"></script>
</body>
</html>
