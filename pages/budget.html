<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ngân sách - Quản Lý Chi Tiêu</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CashManager">
<link rel="stylesheet" href="../assets/css/style.css?v=20261128_v1">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--primary:#2563eb;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
.content{display:grid;gap:22px;padding:28px;max-width:1400px}
.card{background:#fff;border-radius:22px;padding:22px 24px;box-shadow:0 4px 20px -2px rgba(15,23,42,.04);border:1px solid rgba(226,232,240,0.7)}
.card h3{font-size:16px;margin-bottom:14px;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h3{margin:0}
.grid{display:grid;gap:22px}
.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.muted{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:0;border-radius:10px;background:var(--primary);color:#fff;font:700 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,0.3);transition:all .2s ease}
.btn:hover{background:#1d4ed8;transform:translateY(-1px)}
.btn.out{background:#fee2e2;color:var(--red);box-shadow:none}
.btn.ghost{background:#eff6ff;color:var(--primary);box-shadow:none}
.tools{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.tools .field{margin:0;min-width:150px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:13px;color:var(--muted)}
input,select{width:100%;padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,0.12)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row.muted{margin-top:8px}
.act{justify-content:flex-end;margin-top:14px}
.bar{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;width:0;height:100%;border-radius:99px;transition:width .4s}
.bar i.ok{background:var(--green)}.bar i.warn{background:var(--amber)}.bar i.over{background:var(--red)}
.tag{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700}
.tag.ok{background:#d1fae5;color:#047857}.tag.warn{background:#fef3c7;color:#b45309}.tag.over{background:#fee2e2;color:#b91c1c}
.empty{padding:24px;text-align:center;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;background:rgba(15,23,42,.45);backdrop-filter:blur(6px)}
.modal.show{display:flex}
.box{width:min(440px,92vw);padding:26px;border-radius:24px;background:#fff;box-shadow:0 25px 60px -15px rgba(15,23,42,.25)}
.box h3{margin-bottom:16px;font-weight:800}
.box .act{margin-top:6px}
.toast{display:none;position:fixed;right:22px;bottom:22px;z-index:60;padding:12px 18px;border-radius:10px;background:#0f172a;color:#fff}
.toast.show{display:block}.toast.err{background:var(--red)}
</style>
</head>
<body>
<div class="app-shell app-container">
<aside class="app-sidebar sidebar" id="appSidebar">
  <div class="brand-logo-circle" title="Cổng Không Gian Làm Việc (Portal Hub)" onclick="window.location.href='portal.html'" style="cursor: pointer;">
    <i class="fa-solid fa-bolt"></i>
  </div>
  <nav class="sidebar-menu">
    <a href="dashboard.html" class="menu-item">
      <i class="fa-solid fa-table-cells-large"></i>
      <span class="tooltip">Bảng điều khiển</span>
    </a>
    <a href="transactions.html" class="menu-item">
      <i class="fa-solid fa-book-bookmark"></i>
      <span class="tooltip">Sổ giao dịch & Báo cáo</span>
    </a>
    <a href="budget.html" class="menu-item active">
      <i class="fa-solid fa-piggy-bank"></i>
      <span class="tooltip">Ngân sách</span>
    </a>
    <a href="map.html" class="menu-item">
      <i class="fa-solid fa-map-location-dot"></i>
      <span class="tooltip">Bản đồ</span>
    </a>
    <a href="notifications.html" class="menu-item">
      <i class="fa-regular fa-bell"></i>
      <span class="tooltip">Thông báo</span>
    </a>
    <a href="portal.html" class="menu-item" title="Cổng Không Gian">
      <i class="fa-solid fa-layer-group"></i>
      <span class="tooltip">Đổi không gian</span>
    </a>
  </nav>
  <div class="sidebar-bottom">
    <a href="account.html" class="menu-item" title="Tài khoản">
      <i class="fa-solid fa-gear"></i>
      <span class="tooltip">Cài đặt</span>
    </a>
    <a href="javascript:void(0)" class="menu-item" onclick="if(confirm('Bạn có chắc chắn muốn đăng xuất?')){fetch('../api/auth/logout.php',{method:'POST'}).finally(()=>{localStorage.clear();window.location.href='login.html'})}" title="Đăng xuất">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      <span class="tooltip">Đăng xuất</span>
    </a>
  </div>
</aside>
<main class="main-content app-main">
  <header class="app-header header">
    <div class="header-left">
      <h1 class="page-title" style="margin: 0; font-size: 1.5rem; font-weight: 800; color: var(--text-heading);">Kế hoạch ngân sách</h1>
    </div>

    <!-- Center Search Pill -->
    <div class="header-search">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" class="search-pill" placeholder="Tìm kiếm ngân sách, hạn mức danh mục...">
    </div>

    <!-- Right Action & Date Pill -->
    <div class="header-right">
      <button type="button" class="btn-ai-header" onclick="window.location.href='dashboard.html'" title="Trợ lý tài chính AI">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>Trợ lý AI</span>
      </button>
      <div class="date-pill" id="currentDatePill">
        <i class="fa-regular fa-calendar"></i>
        <span>28 Tháng 11, 2026</span>
      </div>
      <button type="button" class="btn-primary" id="btnHeaderAddTx" style="border-radius: var(--radius-pill); padding: 0.5rem 1.15rem; font-size: 0.85rem; font-weight: 700;">
        <i class="fa-solid fa-plus"></i> Đặt ngân sách
      </button>
    </div>
  </header>
  <div class="content-body" style="padding: 1.5rem 2.25rem 2.5rem 2.25rem; max-width: 1400px; width: 100%;">
    <div class="card" style="border-radius: 20px; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04);">
      <div class="tools" style="display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;">
        <div class="field" style="margin: 0; min-width: 160px;"><label for="month" style="font-weight: 700; font-size: 13px; color: var(--muted); margin-bottom: 6px; display: block;">Tháng</label><select id="month"></select></div>
        <div class="field" style="margin: 0; min-width: 160px;"><label for="year" style="font-weight: 700; font-size: 13px; color: var(--muted); margin-bottom: 6px; display: block;">Năm</label><select id="year"></select></div>
        <button class="btn" id="addBtn" style="border-radius: var(--radius-pill); padding: 10px 22px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;"><i class="fa-solid fa-plus"></i> Đặt ngân sách</button>
        <button type="button" class="btn ghost" id="btnSendReport" style="border-radius: var(--radius-pill); padding: 10px 20px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; margin-left: auto;" title="Gửi email báo cáo chi tiết ngân sách"><i class="fa-solid fa-paper-plane"></i> Gửi báo cáo qua Mail</button>
      </div>
    </div>
    <div class="card" style="border-radius: 20px; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04); margin-top: 1.25rem;">
      <div class="head" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;"><h3 style="font-size: 1.05rem; font-weight: 800; color: var(--text-heading); margin: 0;">Tiến độ ngân sách cả tháng</h3><span class="muted" id="sumText" style="font-weight: 600; font-size: 0.88rem;"></span></div>
      <div class="bar" style="height: 10px; border-radius: 99px; background: #e2e8f0; overflow: hidden;"><i id="sumBar"></i></div>
    </div>
    <div class="grid g3" id="grid" style="margin-top: 1.25rem; display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));"></div>
  </div>
</main>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="mTitle">Đặt ngân sách</h3>
    <form id="form">
      <div class="field"><label for="cat">Danh mục chi tiêu</label><select id="cat"></select></div>
      <div class="field"><label for="amount">Hạn mức (đ)</label><input type="number" id="amount" min="1000" step="1000" required></div>
      <div class="field"><label for="thr">Ngưỡng cảnh báo (%)</label><input type="number" id="thr" min="1" max="100" value="80"></div>
      <div class="row act"><button type="button" class="btn ghost" id="cancel">Hủy</button><button type="submit" class="btn">Lưu ngân sách</button></div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../assets/js/pwa.js"></script>
<script src="../assets/js/header_nav.js?v=20261127_m5"></script>
<script src="../assets/js/budget.js"></script>
<script src="../assets/js/ai_chat_widget.js?v=20261128"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const btnHeader = document.getElementById('btnHeaderAddTx');
    const addBtn = document.getElementById('addBtn');
    if (btnHeader && addBtn) {
        btnHeader.addEventListener('click', function(e) {
            e.preventDefault();
            addBtn.click();
        });
    }
});
</script>
</body>
</html>
