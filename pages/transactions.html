<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Giao Dịch & Báo Cáo - CashManager</title>
    <!-- Phụ trách: Lê Quốc Anh (Hợp nhất Thu nhập - Chi tiêu - Báo cáo) -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .tabs-header { display: flex; gap: 0.5rem; border-bottom: 2px solid #e2e8f0; margin-bottom: 1.5rem; overflow-x: auto; }
        .tab-btn { padding: 0.75rem 1.25rem; border: none; background: none; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-btn i { margin-right: 0.4rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-wallet" style="margin-right: 0.5rem; color: var(--primary);"></i> CashManager
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Bảng điều khiển</a></li>
                <li class="active"><a href="transactions.html"><i class="fa-solid fa-book-bookmark"></i> Sổ giao dịch & Báo cáo</a></li>
                <li><a href="budget.html"><i class="fa-solid fa-piggy-bank"></i> Ngân sách</a></li>
                <li><a href="shared.html"><i class="fa-solid fa-users"></i> Quỹ chung</a></li>
                <li><a href="account.html"><i class="fa-solid fa-gear"></i> Tài khoản</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Sổ Giao Dịch & Báo Cáo</h2>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn btn-outline" id="btnExportCombined"><i class="fa-solid fa-file-export"></i> Xuất dữ liệu</button>
                    <button class="btn btn-primary" id="btnNewTransaction"><i class="fa-solid fa-plus"></i> Thêm giao dịch</button>
                </div>
            </header>

            <div class="content-body" style="padding: 1.5rem;">
                <!-- Hệ thống 4 Tab -->
                <div class="tabs-header">
                    <button class="tab-btn active" data-tab="tab-all"><i class="fa-solid fa-list-check"></i> Tất cả giao dịch</button>
                    <button class="tab-btn" data-tab="tab-expense"><i class="fa-solid fa-arrow-up-long" style="color: var(--danger);"></i> Chi tiêu</button>
                    <button class="tab-btn" data-tab="tab-income"><i class="fa-solid fa-arrow-down-long" style="color: var(--success);"></i> Thu nhập</button>
                    <button class="tab-btn" data-tab="tab-report"><i class="fa-solid fa-chart-column" style="color: var(--primary);"></i> Báo cáo & Phân tích</button>
                </div>

                <!-- Tab 1: Tất cả giao dịch -->
                <div id="tab-all" class="tab-content active">
                    <div class="card" style="padding: 1.5rem;">
                        <p style="color: var(--text-muted);">Hiển thị tổng hợp toàn bộ giao dịch Thu và Chi</p>
                        <!-- TODO (Lê Quốc Anh): Render bảng tổng hợp giao dịch -->
                    </div>
                </div>

                <!-- Tab 2: Quản lý Chi tiêu -->
                <div id="tab-expense" class="tab-content">
                    <div class="card" style="padding: 1.5rem;">
                        <p style="color: var(--text-muted);">Chuyên mục Chi tiêu (Tích hợp AI quét hóa đơn OCR)</p>
                    </div>
                </div>

                <!-- Tab 3: Quản lý Thu nhập -->
                <div id="tab-income" class="tab-content">
                    <div class="card" style="padding: 1.5rem;">
                        <p style="color: var(--text-muted);">Chuyên mục Thu nhập</p>
                    </div>
                </div>

                <!-- Tab 4: Báo cáo & Phân tích -->
                <div id="tab-report" class="tab-content">
                    <div class="card" style="padding: 1.5rem;">
                        <p style="color: var(--text-muted);">Biểu đồ phân tích tài chính và công cụ xuất báo cáo</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/transactions.js"></script>
</body>
</html>
