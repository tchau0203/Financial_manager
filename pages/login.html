<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản Lý Chi Tiêu</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f1f5f9; }
        .auth-card { width: 100%; max-width: 400px; background: #fff; padding: 2.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow); }
        .auth-header { text-align: center; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>Đăng Nhập</h2>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Hệ thống Quản lý Chi tiêu Cá nhân</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Tên đăng nhập hoặc Email</label>
                <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập hoặc email" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
            </button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
            Chưa có tài khoản? <a href="register.html" style="color: var(--primary); font-weight: 600;">Đăng ký ngay</a>
        </div>
    </div>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await apiFetch('/auth/login.php', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });

                if (res && res.success) {
                    showToast('Thành công', 'Đăng nhập thành công!', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 800);
                } else {
                    showToast('Thất bại', res ? (res.message || res.error) : 'Sai tài khoản hoặc mật khẩu', 'error');
                }
            } catch (error) {
                console.error('Lỗi đăng nhập:', error);
            }
        });
    </script>
</body>
</html>
